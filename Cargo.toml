[workspace]
resolver = "3"
members = [
    "crates/vela-core",
    "crates/vela-ssh",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Vela Contributors"]
repository = "https://github.com/aboveproof/Vela"

[workspace.dependencies]
base64 = "0.22"
bytes = "1"
directories = "6.0"
keyring = "4.2"
notify = "9.0"
open = "5.4"
russh = "0.65"
russh-sftp = "4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

vela-core = { path = "crates/vela-core" }
vela-ssh = { path = "crates/vela-ssh" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
